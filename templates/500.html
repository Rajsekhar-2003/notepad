<!DOCTYPE html>
<html lang="en-US">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>500 – Server Error | Web Notepad</title>
    <meta name="robots" content="noindex, follow">
    <link rel="icon" type="image/png" href="{{ url_for('static', filename='image.png') }}">
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Arial, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex; align-items: center; justify-content: center;
            padding: 20px; color: #333;
        }
        .card {
            background: white; border-radius: 20px; padding: 50px 40px;
            max-width: 520px; width: 100%; text-align: center;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        .emoji { font-size: 80px; margin-bottom: 20px; }
        h1 { font-size: 32px; margin-bottom: 12px; color: #1a202c; }
        p { color: #64748b; line-height: 1.6; margin-bottom: 25px; }
        .btn {
            display: inline-block; background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white; padding: 12px 28px; border-radius: 40px;
            text-decoration: none; font-weight: 600; transition: transform 0.2s;
        }
        .btn:hover { transform: translateY(-2px); }
        .links { margin-top: 25px; font-size: 14px; }
        .links a { color: #667eea; text-decoration: none; margin: 0 8px; }
        .links a:hover { text-decoration: underline; }
    </style>
</head>
<body>
    <div class="card">
        <div class="emoji">🛠️</div>
        <h1>500 – Server Error</h1>
        <p>Something went wrong on our end. Our team has been notified.<br>Please try again in a moment.</p>
        <a href="/" class="btn">🏠 Go to Homepage</a>
        <div class="links">
            <a href="/">Home</a> ·
            <a href="/access">Receiver</a> ·
            <a href="/about">About</a>
        </div>
    </div>
</body>
</html>
